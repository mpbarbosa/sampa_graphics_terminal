[package]
name = "sampa-terminal"
version = "0.1.0"
edition = "2021"
description = "Sampa graphical terminal — Tauri application shell."
license = "MIT"

[lib]
name = "sampa_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pty-core = { path = "../crates/pty-core" }
