[package]
name = "sampa-terminal"
version = "0.1.0"
edition = "2021"
description = "Sampa graphical terminal — Tauri application shell."
license = "MIT"

[lib]
name = "sampa_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "6"
pty-core = { path = "../crates/pty-core" }
sampa-config = { path = "../crates/config" }
sampa-cli = { path = "../crates/cli" }
sampa-shellint = { path = "../crates/shellint" }
sampa-palette = { path = "../crates/palette" }
sampa-man = { path = "../crates/man" }
sampa-preview = { path = "../crates/preview" }
sampa-ai = { path = "../crates/ai" }
sampa-ps-decorate = { path = "../crates/ps-decorate" }
sampa-fsnav = { path = "../crates/fsnav" }
sampa-dumap = { path = "../crates/dumap" }
sampa-freemem = { path = "../crates/freemem" }
sampa-pingdec = { path = "../crates/pingdec" }
sampa-dfdec = { path = "../crates/dfdec" }
sampa-uptimedec = { path = "../crates/uptimedec" }
sampa-ghhelp = { path = "../crates/ghhelp" }
sampa-cargohelp = { path = "../crates/cargohelp" }
sampa-npmhelp = { path = "../crates/npmhelp" }
sampa-dockerhelp = { path = "../crates/dockerhelp" }
sampa-kubectlhelp = { path = "../crates/kubectlhelp" }
sampa-helmhelp = { path = "../crates/helmhelp" }
sampa-awshelp = { path = "../crates/awshelp" }
sampa-urlpreview = { path = "../crates/urlpreview" }
sampa-netdec = { path = "../crates/netdec" }
# URL-preview fetcher — the second (opt-in) network surface after sampa-ai. Only reached when
# `[url_preview] enabled = true`; the SSRF/size/redirect guards live in preview_url (lib.rs).
ureq = "2"
tokio = { version = "1", features = ["rt"] }
