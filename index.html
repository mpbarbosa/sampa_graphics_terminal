<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sampa Terminal</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar" role="tablist"></div>
      <div id="main">
        <div id="content"></div>
        <aside id="manpanel" hidden>
          <div class="man-head">
            <span id="man-title"></span>
            <button id="man-close" title="Close (Ctrl+Shift+M)">✕</button>
          </div>
          <pre id="man-body"></pre>
        </aside>
      </div>
      <div id="search" hidden>
        <input id="search-input" type="text" placeholder="Search…" spellcheck="false" />
        <button id="search-prev" title="Previous (Shift+Enter)">↑</button>
        <button id="search-next" title="Next (Enter)">↓</button>
        <button id="search-close" title="Close (Esc)">✕</button>
      </div>
      <div id="palette" hidden>
        <div class="palette-box" role="dialog" aria-modal="true">
          <input
            id="palette-input"
            type="text"
            placeholder="Run a command…"
            spellcheck="false"
            autocomplete="off"
          />
          <ul id="palette-list" role="listbox"></ul>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
