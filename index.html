<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sampa Terminal</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar" role="tablist"></div>
      <div id="content"></div>
      <div id="search" hidden>
        <input id="search-input" type="text" placeholder="Search…" spellcheck="false" />
        <button id="search-prev" title="Previous (Shift+Enter)">↑</button>
        <button id="search-next" title="Next (Enter)">↓</button>
        <button id="search-close" title="Close (Esc)">✕</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
